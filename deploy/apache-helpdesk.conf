# Help Desk — an application from us beside the Business OS kernel (mcp-and-api.md §7). Rendered by the kernel's
# installer (bin/app_install.php): {{APP_FQDN}} = helpdesk.<domain>, {{APP_DIR}} = /srv/apps/helpdesk, the ports
# from config/.env. Two virtual hosts: the public name for people (and the two proxied MCP servers), and a loopback
# port for the kernel's actions server and approval replays.

<VirtualHost *:80>
	ServerName {{APP_FQDN}}
	DocumentRoot {{APP_DIR}}/html
	ErrorLog ${APACHE_LOG_DIR}/helpdesk-error.log
	CustomLog ${APACHE_LOG_DIR}/helpdesk-access.log combined
	SetEnvIf X-Forwarded-Proto "https" HTTPS=on

	<Directory {{APP_DIR}}/html>
		Options -Indexes +FollowSymLinks
		AllowOverride None
		Require all granted
	</Directory>

	# The two read MCP servers (Phase 4), under the application's name. Host is NOT preserved (the SDK's DNS-rebinding guard
	# checks it against loopback). Bearer auth is the servers' own (a person's token, or the tenant's run token, or the kernel's).
	ProxyPreserveHost Off
	ProxyPass        /mcp/records  http://127.0.0.1:{{MCP_RECORDS_PORT}}/mcp
	ProxyPassReverse /mcp/records  http://127.0.0.1:{{MCP_RECORDS_PORT}}/mcp
	ProxyPass        /mcp/activity http://127.0.0.1:{{MCP_ACTIVITY_PORT}}/mcp
	ProxyPassReverse /mcp/activity http://127.0.0.1:{{MCP_ACTIVITY_PORT}}/mcp

	RewriteEngine On
	RewriteRule ^/mcp/(records|activity)(/|$) - [L]

	# The health check: the only thing under /api.
	RewriteRule ^/api/v1/health/?$ /api/v1/health.php [L,QSA]
	RewriteRule ^/api/v1/health\.php$ - [L]
	RewriteRule ^/api/ - [R=404,L]

	# The public doors (design §4, D1) — no session; each is CSRF- or signature-checked, rate-limited, logged as portal/webhook:
	#   /request              the public request form            (slice 6)
	#   /t/<48 hex>           an external requester's secure ticket link   (slice 6)
	#   /kb/...               public knowledge base articles     (slice 9)
	#   /channels/malumail/mail   MaluMail's signed new-mail webhook   (slice 7)
	RewriteRule ^/request/?$ /request.php [L,QSA]
	RewriteRule ^/t/([a-f0-9]{48})/?$ /t.php?token=$1 [L,QSA]
	RewriteRule ^/t/([a-f0-9]{48})/(reply|confirm|reopen|rate|attachment)$ /t/$2.php?token=$1 [L,QSA]
	RewriteRule ^/channels/malumail/mail$ /channels/malumail-mail.php [L,QSA]

	# The sign-on receivers.
	RewriteRule ^/sso$ /sso.php [L,QSA]
	RewriteRule ^/sso/logout$ /sso/logout.php [L,QSA]

	# Screens outside the canonical shape (the manifest, Phase 1): a rule's runs, a report, the knowledge base's slugs
	# (/kb/admin/… and /kb/feedback are real files and match the canonical rules below before the slug catch-alls).
	RewriteRule ^/settings/automation/([0-9]+)/runs$ /settings/automation/runs.php?id=$1 [L,QSA]
	RewriteRule ^/tickets/([0-9]+)/merge$ /tickets/merge.php?ticket=$1 [L,QSA]
	RewriteRule ^/reports/([a-z_]+)$ /reports/report.php?report=$1 [L,QSA]
	RewriteRule ^/kb/s/([a-z0-9-]+)$ /kb/section.php?slug=$1 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/kb/$1 !-f
	RewriteCond %{DOCUMENT_ROOT}/kb/$1 !-d
	RewriteCond %{DOCUMENT_ROOT}/kb/$1.php !-f
	RewriteRule ^/kb/([a-z0-9-]+)$ /kb/article.php?slug=$1 [L,QSA]

	# Canonical URLs (the action manifest, Phase 1): /x/new → form.php, /x/{id}/edit → form.php?id=, /x/{id} → view.php?id=.
	RewriteCond %{DOCUMENT_ROOT}/$1/form.php -f
	RewriteRule ^/(.+)/new$ /$1/form.php [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/form.php -f
	RewriteRule ^/(.+)/([0-9]+)/edit$ /$1/form.php?id=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/view.php -f
	RewriteRule ^/(.+)/([0-9]+)$ /$1/view.php?id=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1.php -f
	RewriteRule ^/(.+?)/?$ /$1.php [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/index.php -f
	RewriteRule ^/(.+[^/])$ /$1/index.php [L,QSA]
</VirtualHost>

# PHP on the internal port, for the kernel's actions server and approval replays only.
Listen 127.0.0.1:{{APP_INTERNAL_PORT}}
<VirtualHost 127.0.0.1:{{APP_INTERNAL_PORT}}>
	DocumentRoot {{APP_DIR}}/html
	ErrorLog ${APACHE_LOG_DIR}/helpdesk-error.log
	CustomLog ${APACHE_LOG_DIR}/helpdesk-access.log combined
	<Directory {{APP_DIR}}/html>
		Options -Indexes +FollowSymLinks
		AllowOverride None
		Require all granted
	</Directory>
	RewriteEngine On
	RewriteRule ^/api/v1/health/?$ /api/v1/health.php [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/form.php -f
	RewriteRule ^/(.+)/new$ /$1/form.php [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/form.php -f
	RewriteRule ^/(.+)/([0-9]+)/edit$ /$1/form.php?id=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/view.php -f
	RewriteRule ^/(.+)/([0-9]+)$ /$1/view.php?id=$2 [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1.php -f
	RewriteRule ^/(.+?)/?$ /$1.php [L,QSA]
	RewriteCond %{DOCUMENT_ROOT}/$1/index.php -f
	RewriteRule ^/(.+[^/])$ /$1/index.php [L,QSA]
</VirtualHost>
